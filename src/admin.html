<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Droplet Store — administration</title>
<style>
  :root { color-scheme: light dark; --fond: #f2f2f7; --ilot: #fff; --texte: #000; --gris: #6e6e73; --trait: rgb(60 60 67 / .18); --accent: #0a62ff; --rouge: #d70015; --vert: #1a7f37; --or: #a8640a; --mono: ui-monospace, 'SF Mono', Menlo, monospace; }
  @media (prefers-color-scheme: dark) { :root { --fond: #000; --ilot: #1c1c1e; --texte: #fff; --gris: #98989f; --trait: rgb(84 84 88 / .6); --accent: #3d8bff; --rouge: #ff453a; --vert: #30d158; --or: #ffb340; } }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 -apple-system, system-ui, 'Segoe UI', sans-serif; background: var(--fond); color: var(--texte); -webkit-font-smoothing: antialiased; }
  [hidden] { display: none !important; }
  header { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 16px; padding: 14px 24px; background: color-mix(in srgb, var(--fond) 82%, transparent); backdrop-filter: blur(20px); border-bottom: .5px solid var(--trait); }
  header h1 { margin: 0; font-size: 17px; font-weight: 650; }
  nav { display: flex; gap: 2px; padding: 2px; border-radius: 9px; background: rgb(120 120 128 / .14); overflow-x: auto; }
  nav button { border: 0; background: none; color: inherit; font: 500 13px inherit; padding: 6px 12px; border-radius: 7px; cursor: pointer; white-space: nowrap; }
  nav button[aria-selected="true"] { background: var(--ilot); box-shadow: 0 1px 3px rgb(0 0 0 / .15); }
  main { max-width: 1100px; margin: 0 auto; padding: 24px; }
  h2 { font-size: 28px; font-weight: 700; letter-spacing: -.02em; margin: 8px 0 18px; }
  h3 { font-size: 13px; font-weight: 500; color: var(--gris); margin: 24px 16px 8px; }
  .ilot { background: var(--ilot); border-radius: 12px; overflow: hidden; }
  .chiffres { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .chiffre { background: var(--ilot); border-radius: 12px; padding: 16px; }
  .chiffre b { display: block; font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .chiffre span { color: var(--gris); font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-weight: 500; color: var(--gris); font-size: 12px; padding: 10px 12px; border-bottom: .5px solid var(--trait); }
  td { padding: 10px 12px; border-bottom: .5px solid var(--trait); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  td.n { text-align: right; font-variant-numeric: tabular-nums; }
  code, .mono { font-family: var(--mono); font-size: 12px; }
  input, select, textarea { font: inherit; color: inherit; background: rgb(120 120 128 / .12); border: 0; border-radius: 8px; padding: 6px 10px; }
  input[type=number] { width: 90px; text-align: right; }
  textarea { width: 100%; min-height: 160px; font-family: var(--mono); font-size: 12px; }
  button.b { border: 0; border-radius: 8px; padding: 7px 14px; font: 600 13px inherit; cursor: pointer; background: var(--accent); color: #fff; }
  button.b.discret { background: rgb(120 120 128 / .14); color: var(--accent); }
  button.b.danger { background: rgb(255 59 48 / .14); color: var(--rouge); }
  .pastille { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 12px; font-weight: 600; background: rgb(120 120 128 / .14); }
  .pastille.publie, .pastille.reussie { color: var(--vert); }
  .pastille.a_verifier, .pastille.en_revue { color: var(--or); }
  .pastille.echouee, .pastille.refuse, .pastille.retire { color: var(--rouge); }
  .connexion { max-width: 420px; margin: 12vh auto; padding: 24px; }
  .connexion p { color: var(--gris); }
  .connexion input { width: 100%; padding: 12px; margin: 8px 0 12px; }
  .ligne-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 12px 16px; }
  .note { color: var(--gris); font-size: 13px; padding: 0 16px; }
  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--texte); color: var(--fond); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; }
</style>
</head>
<body>
<div class="connexion" id="connexion">
  <h2>Droplet Store</h2>
  <p>Administration. Le jeton reste dans cet onglet et disparaît à sa fermeture.</p>
  <input id="jeton" type="password" autocomplete="off" placeholder="Jeton d’administration" aria-label="Jeton d’administration">
  <button class="b" id="entrer">Entrer</button>
  <p id="erreur-connexion" hidden style="color:var(--rouge)">Jeton refusé.</p>
</div>

<div id="app" hidden>
  <header>
    <h1>Droplet Store</h1>
    <nav id="onglets">
      <button data-v="tableau" aria-selected="true">Tableau</button>
      <button data-v="produits">Produits</button>
      <button data-v="paliers">Packs DC</button>
      <button data-v="recharges">Recharges</button>
      <button data-v="transactions">Transactions</button>
      <button data-v="moderation">Modération</button>
      <button data-v="createurs">Créateurs</button>
      <button data-v="abonnements">Abonnements</button>
      <button data-v="securite">Sécurité</button>
    </nav>
  </header>
  <main id="vue"></main>
</div>
<div id="toast" hidden></div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const date = (d) => d ? new Date(d).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' }) : '—';
  const nom = (p) => esc(p.donnees?.nom?.fr ?? p.cle);
  let jeton = '';
  try { jeton = sessionStorage.getItem('jeton-admin') || ''; } catch {}

  async function api(methode, chemin, corps) {
    const r = await fetch(chemin, { method: methode, headers: { Authorization: `Bearer ${jeton}`, 'Content-Type': 'application/json' }, body: corps ? JSON.stringify(corps) : undefined });
    const j = await r.json().catch(() => ({}));
    if (r.status === 401) { deconnecter(); throw new Error('non_autorise'); }
    if (!r.ok) throw new Error(j.erreur || `http_${r.status}`);
    return j;
  }
  function toast(t) { const e = $('#toast'); e.textContent = t; e.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (e.hidden = true), 2600); }
  const tenter = (f) => async (...a) => { try { await f(...a); } catch (e) { if (e.message !== 'non_autorise') toast(`Erreur : ${e.message}`); } };
  function deconnecter() { jeton = ''; try { sessionStorage.removeItem('jeton-admin'); } catch {} $('#app').hidden = true; $('#connexion').hidden = false; }

  $('#entrer').onclick = tenter(async () => {
    jeton = $('#jeton').value.trim();
    try { await api('GET', '/admin/v1/tableau'); } catch { $('#erreur-connexion').hidden = false; return; }
    try { sessionStorage.setItem('jeton-admin', jeton); } catch {}
    $('#connexion').hidden = true; $('#app').hidden = false; montrer('tableau');
  });
  $('#jeton').onkeydown = (e) => { if (e.key === 'Enter') $('#entrer').click(); };
  $('#onglets').onclick = (e) => { const b = e.target.closest('button'); if (b) montrer(b.dataset.v); };

  const vues = {
    async tableau() {
      const t = await api('GET', '/admin/v1/tableau');
      return `<h2>Tableau</h2><div class="chiffres">
        <div class="chiffre"><b>${t.ventes30j.achats}</b><span>achats sur 30 jours</span></div>
        <div class="chiffre"><b>${Number(t.ventes30j.dc).toLocaleString('fr-FR')} DC</b><span>dépensés sur 30 jours</span></div>
        <div class="chiffre"><b>${Number(t.recharges30j.xaf).toLocaleString('fr-FR')} F</b><span>encaissés sur 30 jours (${t.recharges30j.nombre} recharges)</span></div>
        <div class="chiffre"><b style="color:${t.aVerifier ? 'var(--or)' : 'inherit'}">${t.aVerifier}</b><span>recharges à vérifier</span></div>
        <div class="chiffre"><b style="color:${t.suspects ? 'var(--rouge)' : 'inherit'}">${t.suspects}</b><span>signaux suspects</span></div></div>
        <h3>Les plus vendus, 30 jours</h3><div class="ilot"><table><tr><th>Produit</th><th class="n">Ventes</th><th class="n">DC</th></tr>
        ${t.top.map((x) => `<tr><td><code>${esc(x.produit)}</code></td><td class="n">${x.n}</td><td class="n">${esc(x.dc)}</td></tr>`).join('') || '<tr><td colspan="3" class="note">Aucune vente pour l’instant.</td></tr>'}</table></div>`;
    },
    async produits() {
      const { produits } = await api('GET', '/admin/v1/produits');
      return `<h2>Produits</h2><p class="note">Un changement de prix s’applique tout de suite et reste dans l’historique : « Prix » montre les ventes avant et après.</p>
        <div class="ilot"><table><tr><th>Article</th><th>Catégorie</th><th>Genre</th><th class="n">Prix (DC)</th><th>Statut</th><th class="n">Possédé par</th><th></th></tr>
        ${produits.map((p) => `<tr><td><b>${nom(p)}</b><br><code>${esc(p.cle)}</code>${p.createur ? ` · <span class="pastille">${esc(p.createur)}</span>` : ''}</td>
          <td>${esc(p.categorie)}</td><td>${esc(p.genre)}${p.jours ? ` · ${p.jours} j` : ''}</td>
          <td class="n"><input type="number" min="0" value="${esc(p.prix)}" data-prix="${esc(p.cle)}" aria-label="Prix de ${nom(p)}"></td>
          <td><select data-statut="${esc(p.cle)}" aria-label="Statut de ${nom(p)}">${['brouillon', 'en_revue', 'publie', 'refuse', 'retire'].map((s) => `<option ${s === p.statut ? 'selected' : ''}>${s}</option>`).join('')}</select></td>
          <td class="n">${p.possesseurs}</td><td><button class="b discret" data-histo="${esc(p.cle)}">Prix</button></td></tr>`).join('')}</table></div>
        <h3>Ajouter un article</h3><div class="ilot"><div class="ligne-form" style="display:block">
        <p class="note" style="padding:0 0 8px">JSON. Genres connus de l’app : cadre, style_nom, badge, theme, stickers, pack, pro, premium, collection. Un article ajouté arrive en brouillon.</p>
        <textarea id="nouveau">${esc(JSON.stringify({ cle: 'cadre_nouveau', categorie: 'identite', genre: 'cadre', prix: 75, donnees: { motif: 'sceau', teintes: ['#FFFFFF', '#9AA4B5'], nom: { fr: 'Nouveau cadre', en: 'New frame' }, texte: { fr: '…', en: '…' } } }, null, 2))}</textarea>
        <p><button class="b" id="creer">Créer en brouillon</button></p></div></div>`;
    },
    async paliers() {
      const { paliers } = await api('GET', '/admin/v1/paliers');
      return `<h2>Packs DC</h2><div class="ilot"><table><tr><th>Pack</th><th class="n">DC</th><th class="n">Prix (F CFA)</th><th>Actif</th><th></th></tr>
        ${paliers.map((p) => `<tr><td><code>${esc(p.cle)}</code></td><td class="n"><input type="number" min="1" value="${esc(p.credits)}" data-pc="${esc(p.cle)}"></td>
          <td class="n"><input type="number" min="1" value="${esc(p.montant_xaf)}" data-px="${esc(p.cle)}"></td>
          <td><input type="checkbox" ${p.actif ? 'checked' : ''} data-pa="${esc(p.cle)}"></td><td><button class="b discret" data-palier="${esc(p.cle)}">Enregistrer</button></td></tr>`).join('')}</table></div>`;
    },
    async recharges() {
      const { recharges } = await api('GET', '/admin/v1/recharges');
      return `<h2>Recharges</h2><p class="note">« À vérifier » : l’opérateur n’a pas encore tranché, ou a répondu un montant inattendu. Rien n’a été crédité.</p>
        <div class="ilot"><table><tr><th>Quand</th><th>Compte</th><th>Pack</th><th class="n">F CFA</th><th>Via</th><th>Téléphone</th><th>État</th><th></th></tr>
        ${recharges.map((r) => `<tr><td>${date(r.cree_le)}</td><td><code>${esc(r.compte.slice(0, 10))}…</code></td><td>${esc(r.palier)}</td><td class="n">${esc(r.montant_xaf)}</td>
          <td>${esc(r.fournisseur)}</td><td class="mono">${esc(r.telephone_masque)}</td><td><span class="pastille ${esc(r.etat)}">${esc(r.etat)}</span></td>
          <td><button class="b discret" data-evts="${esc(r.id)}">Événements</button></td></tr>`).join('') || '<tr><td colspan="8" class="note">Aucune recharge.</td></tr>'}</table></div><div id="evts"></div>`;
    },
    async transactions() {
      const { operations } = await api('GET', '/admin/v1/transactions');
      return `<h2>Transactions</h2><div class="ilot"><table><tr><th>Quand</th><th>Nature</th><th>Détails</th><th>Écritures</th><th></th></tr>
        ${operations.map((o) => `<tr><td>${date(o.cree_le)}</td><td><span class="pastille">${esc(o.nature)}</span></td>
          <td class="mono">${esc(JSON.stringify(o.details))}</td>
          <td class="mono">${(o.lignes || []).map((l) => `${esc(l.compte.split(':')[0])} ${l.montant > 0 ? '+' : ''}${esc(l.montant)}`).join('<br>')}</td>
          <td>${['achat', 'cadeau'].includes(o.nature) ? `<button class="b danger" data-rembourser="${esc(o.id)}">Rembourser</button>` : ''}</td></tr>`).join('')}</table></div>`;
    },
    async moderation() {
      const { aRevoir } = await api('GET', '/admin/v1/moderation');
      return `<h2>Modération</h2><div class="ilot"><table><tr><th>Article</th><th>Créateur</th><th class="n">Prix</th><th></th></tr>
        ${aRevoir.map((p) => `<tr><td><b>${nom(p)}</b><br><code>${esc(p.cle)}</code></td><td>${esc(p.createur ?? '—')}</td><td class="n">${esc(p.prix)}</td>
          <td><button class="b" data-mod="${esc(p.cle)}" data-d="publier">Publier</button> <button class="b danger" data-mod="${esc(p.cle)}" data-d="refuser">Refuser</button></td></tr>`).join('') || '<tr><td colspan="4" class="note">Rien à revoir.</td></tr>'}</table></div>`;
    },
    async createurs() {
      const { createurs } = await api('GET', '/admin/v1/createurs');
      return `<h2>Créateurs</h2><p class="note">La rémunération des créateurs n’est pas en place : elle demande un contrat et un cadre fiscal. Ici, seulement les profils et leurs ventes.</p>
        <div class="ilot"><table><tr><th>Créateur</th><th>Statut</th><th class="n">Publiés</th><th class="n">Ventes</th><th></th></tr>
        ${createurs.map((c) => `<tr><td><b>${esc(c.nom_public)}</b><br><code>${esc(c.id)}</code></td><td><span class="pastille">${esc(c.statut)}</span></td><td class="n">${c.publies}</td><td class="n">${c.ventes}</td>
          <td><button class="b discret" data-createur="${esc(c.id)}" data-s="${c.statut === 'actif' ? 'suspendu' : 'actif'}">${c.statut === 'actif' ? 'Suspendre' : 'Réactiver'}</button></td></tr>`).join('') || '<tr><td colspan="5" class="note">Aucun créateur.</td></tr>'}</table>
        <div class="ligne-form"><input id="c-id" placeholder="identifiant (a-z0-9_)"><input id="c-nom" placeholder="Nom public"><button class="b" id="c-creer">Ajouter</button></div></div>`;
    },
    async abonnements() {
      const { abonnements } = await api('GET', '/admin/v1/abonnements');
      return `<h2>Abonnements actifs</h2><div class="ilot"><table><tr><th>Compte</th><th>Produit</th><th>Jusqu’au</th></tr>
        ${abonnements.map((a) => `<tr><td><code>${esc(a.compte.slice(0, 12))}…</code></td><td>${esc(a.produit)}</td><td>${date(a.fin)}</td></tr>`).join('') || '<tr><td colspan="3" class="note">Aucun abonnement actif.</td></tr>'}</table></div>`;
    },
    async securite() {
      const [{ signaux }, integ, { lignes }] = await Promise.all([api('GET', '/admin/v1/suspects'), api('GET', '/admin/v1/integrite'), api('GET', '/admin/v1/journal')]);
      return `<h2>Sécurité</h2><div class="chiffres">
        <div class="chiffre"><b style="color:${integ.registre.length ? 'var(--rouge)' : 'var(--vert)'}">${integ.registre.length ? 'Anomalie' : 'Équilibré'}</b><span>registre en partie double</span></div>
        <div class="chiffre"><b style="color:${integ.journal.ok ? 'var(--vert)' : 'var(--rouge)'}">${integ.journal.ok ? 'Intact' : 'Rompu'}</b><span>journal chaîné (${integ.journal.lignes ?? '?'} lignes)</span></div></div>
        <h3>Signaux (à examiner, pas des verdicts)</h3><div class="ilot"><table><tr><th>Signal</th><th>Compte</th><th class="n">Nombre</th></tr>
        ${signaux.map((s) => `<tr><td>${esc(s.signal)}</td><td><code>${esc(s.compte)}</code></td><td class="n">${s.n}</td></tr>`).join('') || '<tr><td colspan="3" class="note">Aucun signal.</td></tr>'}</table></div>
        <h3>Journal</h3><div class="ilot"><table><tr><th>Quand</th><th>Acteur</th><th>Action</th><th>Détails</th></tr>
        ${lignes.map((l) => `<tr><td>${date(l.quand)}</td><td>${esc(l.acteur.slice(0, 14))}</td><td>${esc(l.action)}</td><td class="mono">${esc(JSON.stringify(l.details))}</td></tr>`).join('')}</table></div>`;
    },
  };

  const montrer = tenter(async (v) => {
    document.querySelectorAll('#onglets button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.v === v)));
    $('#vue').innerHTML = await vues[v]();
    $('#vue').dataset.v = v;
  });

  $('#vue').addEventListener('change', tenter(async (e) => {
    const t = e.target;
    if (t.dataset.prix) { await api('PATCH', `/admin/v1/produits/${t.dataset.prix}`, { prix: t.value }); toast('Prix enregistré'); }
    if (t.dataset.statut) { await api('PATCH', `/admin/v1/produits/${t.dataset.statut}`, { statut: t.value }); toast('Statut enregistré'); }
  }));
  $('#vue').addEventListener('click', tenter(async (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    const d = b.dataset;
    if (d.histo) {
      const { periodes } = await api('GET', `/admin/v1/produits/${d.histo}/prix`);
      alert(periodes.map((p) => `${p.prix} DC depuis ${date(p.depuis)} : ${p.ventes} ventes en ${Number(p.jours).toFixed(1)} j (${(p.ventes / Math.max(p.jours, 0.01)).toFixed(2)}/j)`).join('\n'));
    }
    if (b.id === 'creer') {
      let corps; try { corps = JSON.parse($('#nouveau').value); } catch { return toast('JSON invalide'); }
      await api('POST', '/admin/v1/produits', { ...corps, statut: 'brouillon' }); toast('Article créé en brouillon'); montrer('produits');
    }
    if (d.palier) {
      const k = d.palier;
      await api('PATCH', `/admin/v1/paliers/${k}`, { credits: $(`[data-pc="${k}"]`).value, montantXaf: $(`[data-px="${k}"]`).value, actif: $(`[data-pa="${k}"]`).checked });
      toast('Pack enregistré');
    }
    if (d.evts) {
      const { evenements } = await api('GET', `/admin/v1/recharges/${d.evts}/evenements`);
      $('#evts').innerHTML = `<h3>Événements de la recharge</h3><div class="ilot"><table><tr><th>Quand</th><th>Source</th><th>État</th><th class="n">Montant</th><th>Message</th></tr>
        ${evenements.map((x) => `<tr><td>${date(x.quand)}</td><td>${esc(x.source)}</td><td>${esc(x.etat)}</td><td class="n">${esc(x.montant ?? '—')} ${esc(x.devise ?? '')}</td><td>${esc(x.message ?? '')}</td></tr>`).join('')}</table></div>`;
    }
    if (d.rembourser) {
      const motif = prompt('Motif du remboursement (gardé au journal) :');
      if (!motif) return;
      const r = await api('POST', '/admin/v1/remboursements', { operation: d.rembourser, motif });
      toast(`Remboursé, articles retirés : ${r.droitsRetires.join(', ') || 'aucun'}`); montrer('transactions');
    }
    if (d.mod) {
      const motif = d.d === 'refuser' ? prompt('Motif du refus (montré au créateur) :') : undefined;
      if (d.d === 'refuser' && !motif) return;
      await api('POST', `/admin/v1/moderation/${d.mod}`, { decision: d.d, motif }); toast('Décision enregistrée'); montrer('moderation');
    }
    if (d.createur) { await api('PATCH', `/admin/v1/createurs/${d.createur}`, { statut: d.s }); montrer('createurs'); }
    if (b.id === 'c-creer') { await api('POST', '/admin/v1/createurs', { id: $('#c-id').value.trim(), nomPublic: $('#c-nom').value.trim() }); montrer('createurs'); }
  }));

  if (jeton) api('GET', '/admin/v1/tableau').then(() => { $('#connexion').hidden = true; $('#app').hidden = false; montrer('tableau'); }).catch(() => {});
})();
</script>
</body>
</html>
