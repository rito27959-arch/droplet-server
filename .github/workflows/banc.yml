# Banc d'essai EN DIRECT du serveur déployé (branche banc-appels) :
# journal publié sur la branche `journal-banc`.
name: Banc d'essai des appels
on:
  push:
    branches: [banc-appels]
permissions:
  contents: write
jobs:
  banc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          pip install -q websockets
          python3 outils/liste_appareils.py 0bac708d10507bf993bf35314393d2df6ef78a70d7e0b6117193982dc81b5e83 > /tmp/journal.txt 2>&1
          cat /tmp/journal.txt
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git checkout -q --orphan journal-banc; git rm -rfq . >/dev/null
          cp /tmp/journal.txt journal.txt; git add journal.txt; git commit -qm "banc $GITHUB_SHA"; git push -fq origin journal-banc
